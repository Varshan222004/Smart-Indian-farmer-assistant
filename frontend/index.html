<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#16a34a" />
    <meta name="description" content="AI-powered agricultural assistant for crop recommendations, disease detection, fertilizer suggestions, and farming advice" />
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline' https://translate.google.com https://*.googleapis.com; frame-src 'self' https://translate.google.com;">
    
    <!-- PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Farmer Assistant" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
    <link rel="manifest" href="/manifest.json" />
    
    <title>Smart Indian Farmer Assistant</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Google Translate Widget - Loaded in body for better compatibility -->
    <script type="text/javascript">
      function googleTranslateElementInit() {
        try {
          if (typeof google !== 'undefined' && google.translate && google.translate.TranslateElement) {
            new google.translate.TranslateElement({
              pageLanguage: 'en',
              includedLanguages: 'en,hi,ta',
              layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
              autoDisplay: false,
              multilanguagePage: true
            }, 'google_translate_element');
          } else {
            console.error('Google Translate API not loaded');
          }
        } catch (e) {
          console.error('Error initializing Google Translate:', e);
        }
      }
      
      // Load Google Translate script with retry
      (function loadGoogleTranslate() {
        if (document.querySelector('script[src*="translate_a/element.js"]')) {
          // Already loading or loaded
          if (window.google && window.google.translate) {
            googleTranslateElementInit();
          }
          return;
        }
        
        var script = document.createElement('script');
        script.type = 'text/javascript';
        script.src = 'https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit';
        script.async = true;
        script.defer = true;
        script.onerror = function() {
          console.error('Failed to load Google Translate script');
          // Retry after 2 seconds
          setTimeout(loadGoogleTranslate, 2000);
        };
        script.onload = function() {
          console.log('Google Translate script loaded');
        };
        (document.head || document.body).appendChild(script);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
